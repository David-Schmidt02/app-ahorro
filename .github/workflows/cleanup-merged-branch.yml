name: Cleanup Merged Branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    name: Delete Merged Head Branch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete Head Branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const protectedBranches = ['main', 'development', 'master', 'staging', 'production'];
            
            if (protectedBranches.includes(branchName)) {
              console.log(`Branch '${branchName}' is in protected list. Skipping deletion.`);
              return;
            }

            const ref = `heads/${branchName}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: ref
              });
              console.log(`Successfully deleted branch: ${branchName}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                console.log(`Branch '${branchName}' already deleted or does not exist.`);
              } else {
                console.error(`Failed to delete branch '${branchName}':`, error);
                throw error;
              }
            }
