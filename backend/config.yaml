# App de Ahorro - Configuration (ÚNICA fuente de configuración)

app:
  name: "App de Ahorro"
  version: "1.0.0"
  api_prefix: "/api/v1"

database:
  url: "sqlite:///./app_ahorro.db"
  pool_size: 5
  max_overflow: 10
  echo: false

jwt:
  enabled: true
  secret_key: "your-secret-key-change-in-production-min-32-chars-long"
  algorithm: "HS256"
  access_token_expire_minutes: 30


rate_limit:
  enabled: false
  requests_per_minute: 60

tasa_cambio:
  tipo_cotizacion_default: "BLUE"
  horas_vigencia: 24
  api_url: "https://dolarapi.com/v1/dolares"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console:
    enabled: true
  file:
    enabled: true
    path: "logs/app.log"
    max_bytes: 10485760  # 10MB
    backup_count: 7      # 7 days retention
    rotation: "daily"
  suppress_uvicorn: true

config_reload:
  enabled: true
  check_interval_seconds: 30

test_user:
  email: "test@appahorro.com"
  password: "password123"
