# App de Ahorro - Configuration
# IMPORTANTE: En producción (Railway), las variables de entorno sobreescriben este archivo:
#   DATABASE_URL  → database.url
#   SECRET_KEY    → jwt.secret_key

app:
  name: "App de Ahorro"
  version: "1.0.0"
  api_prefix: "/api/v1"

database:
  # Desarrollo local: SQLite. En producción Railway inyecta DATABASE_URL automáticamente.
  url: "sqlite:///./app_ahorro.db"
  pool_size: 5
  max_overflow: 10
  echo: false

jwt:
  enabled: true
  # En producción sobreescribir con la env var SECRET_KEY
  secret_key: "dev-secret-key-change-in-production-min-32-chars"
  algorithm: "HS256"
  access_token_expire_minutes: 30

rate_limit:
  enabled: false
  requests_per_minute: 60

tasa_cambio:
  tipo_cotizacion_default: "BLUE"
  horas_vigencia: 24
  api_url: "https://dolarapi.com/v1/dolares"

logging:
  level: "WARNING"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console:
    enabled: true
  file:
    enabled: false  # Desactivado en producción (Railway maneja los logs)
    path: "logs/app.log"
    max_bytes: 10485760  # 10MB
    backup_count: 7
    rotation: "daily"
  suppress_uvicorn: true

config_reload:
  enabled: false  # Sin sentido en Railway (el archivo no cambia en runtime)
  check_interval_seconds: 30

test_user:
  email: "test@appahorro.com"
  password: "password123"

development:
  # Desactiva el login para desarrollo local sin necesidad de credentials
  # En producción (Railway) cambiar a false y usar jwt normal
  bypass_auth: true
  # Usuario que se usa cuando bypass_auth=true
  default_user_id: 1
  default_user_email: "dev@local.com"
  default_user_name: "Dev User"
